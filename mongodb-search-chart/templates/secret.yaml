apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.general.name }}-keyfile
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.general.name }}
type: Opaque
stringData:
  keyfile: {{ .Values.auth.keyfile | quote }}
  root-pass: {{ .Values.auth.rootPassword | quote }}
  mongot-pass: {{ .Values.auth.mongotPassword | quote }}
