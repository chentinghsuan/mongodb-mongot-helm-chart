# [情境] 團隊 UAT 測試環境 / 3 節點 Replica Set 配置範例
general:
  name: "mongodb-rs"
  replicaSetName: "rs-cluster"

global:
  storageClass: "standard-rwo"  # 依雲端平台指定 (如 GCP standard-rwo, AWS gp3)

mongod:
  replicas: 3
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  persistence:
    size: 50Gi

mongot:
  replicas: 1
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  persistence:
    size: 30Gi
